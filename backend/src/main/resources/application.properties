
server.address=0.0.0.0
server.port=8080


spring.datasource.url=jdbc:mysql://localhost:3306/weconnect_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=121930
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=WeConnectSecretKey2026SuperSecureRandomStringForJWTTokenGeneration123456
jwt.expiration=86400000

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Firebase Cloud Messaging (uncomment after adding firebase-service-account.json to resources/)
firebase.service-account-key=classpath:firebase-service-account.json

# Gmail SMTP (set MAIL_USERNAME and MAIL_PASSWORD as environment variables)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OTP settings
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60