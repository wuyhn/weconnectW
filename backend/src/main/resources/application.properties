server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/weconnect_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:false}

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Firebase Cloud Messaging
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.service-account-key=${FIREBASE_SERVICE_ACCOUNT_KEY:}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gemini AI
gemini.api.key=${GEMINI_API_KEY:}

# Admin seed account. Set ADMIN_DEFAULT_PASSWORD only in local/demo environment.
app.admin.email=${ADMIN_EMAIL:admin@weconnect.com}
app.admin.password=${ADMIN_DEFAULT_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:Admin WeConnect}

# One-time startup maintenance. Keep false unless intentionally running a migration.
app.migration.report-status-on-startup=${MIGRATE_REPORT_STATUS_ON_STARTUP:false}
app.migration.recalculate-reputation-on-startup=${RECALCULATE_REPUTATION_ON_STARTUP:false}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:3000}

# OTP settings
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
